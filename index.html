<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Kanban Board</h1>

        <div class="task-input">
            <input
                type="text"
                id="task-input"
                placeholder="Enter new task..."
            >

            <button id="add-btn">
                Add Task
            </button>
        </div>
    </header>

    <main class="board">

        <section class="column">

            <h2>Todo</h2>

            <div
                class="task-container"
                id="todo-container"
            >

            </div>

        </section>

        <section class="column">

            <h2>In Progress</h2>

            <div
                class="task-container"
                id="progress-container"
            >

            </div>

        </section>

        <section class="column">

            <h2>Done</h2>

            <div
                class="task-container"
                id="done-container"
            >

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
